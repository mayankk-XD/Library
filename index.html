
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pustakalay</h1>
      <button class="Add">Add +</button>
    </header>

    <main>
      <section class="formm">
        <form action="#" method="post">
          <div>
            <label for="book_name">Book Name</label>
            <input type="text" id="book_name" name="book_name" required />
          </div>

          <div>
            <label for="author_name">Author</label>
            <input type="text" id="author_name" name="author_name" required />
          </div>

          <div>
            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" required />
          </div>

          <div class="readdd">
            <p>Read ?</p>
            <label for="read">YES</label>
            <input type="radio" id="read" name="read" value="yes" />
            <label for="not_read">NO!</label>
            <input type="radio" id="not_read" name="read" value="no" />
          </div>

          <div class="formButtons">
            <button type="submit">Submit</button>
            <button type="button" class="closeForm">&times;</button>
          </div>
        </form>
      </section>

      <section class="bookShell">
        <div class="library"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
